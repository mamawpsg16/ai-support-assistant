<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storefront</title>

    <!--
      Web-fonts used by the new design: Fraunces (serif headings) + Inter Tight (UI).
      preconnect warms up the connection to Google's font servers so the fonts arrive
      a little sooner. The stylesheet then pulls only the weights we actually use.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      This is the ONLY html page in a Single Page Application (SPA).
      The empty <div id="app"> below is where Vue "mounts" — Vue takes over this
      div and renders all pages inside it with JavaScript. The user never loads a
      second html file; vue-router swaps the content as you navigate.
    -->
    <div id="app"></div>

    <!-- type="module" lets the browser use import/export. Vite serves this file. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
